<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EDE8DF" />
    <meta name="description" content="题取 —— 把 PDF 试卷变成可点选的题目，一键问自己的 AI。" />
    <title>题取 · PDF 题目助手</title>
    <style>
      /* 首屏骨架：避免 JS 加载期间的白闪。与应用同一套底色。 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ede8df;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 14px;
        font-family: 'Inter', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #8d939a;
        transition: opacity 260ms ease;
      }
      #boot .mark {
        width: 34px;
        height: 34px;
        color: #23456b;
        opacity: 0.9;
      }
      #boot .name {
        font-family: 'Songti SC', 'SimSun', Georgia, serif;
        font-size: 17px;
        letter-spacing: 0.24em;
        color: #23456b;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0c1013;
        }
        #boot {
          color: #6e7b85;
        }
        #boot .mark,
        #boot .name {
          color: #8fb3d8;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.4" y="3.4" width="17.2" height="17.2" rx="4.6" stroke="currentColor" stroke-width="1.6" />
        <path d="M9.5 9.3a2.5 2.5 0 1 1 3.5 2.3c-.7.35-1 .9-1 1.6v.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <circle cx="12" cy="16.6" r="1" fill="currentColor" />
      </svg>
      <div class="name">题取</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
